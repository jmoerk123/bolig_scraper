[project]
name = "bolig_scraper"
description = "Webscraper for boligsiden"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12.3",
    "geopy>=2.4.1",
    "googlemaps>=4.10.0",
    "pandas>=2.2.3",
    "pyyaml>=6.0.2",
    "requests>=2.32.3",
    "selenium>=4.33.0",
]
dynamic = ["version"]

[project.optional-dependencies]
vis = [
    "plotly>=5.24.1",
]
notebook = [
    "nbformat>=5.10.4",
    "ipykernel>=6.29.5",
]

[tool.uv]
dev-dependencies = [
    "pytest~=8.3",
    "mypy>=1.11",
    # Ruff CI version is in .gitlab-ci.yml
    "ruff==0.6.3",
    "pandas-stubs>=2.2.2.240909",
]

# [tool.uv.sources]
# netra-fm-outlierdetection = { path = "../netra-fm-outlierdetection", editable = true }

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/bolig_scraper"]

[tool.mypy]
python_version = "3.12"
mypy_path = "scrapers"
explicit_package_bases = true
packages = ["bolig_scraper"]

[[tool.mypy.overrides]]
module = [
    "plotly.*",  # https://github.com/plotly/plotly.py/issues/1103
    "requests.*",
    "googlemaps.*",
    "yaml.*",
]
ignore_missing_imports = true

[tool.ruff]
target-version = "py312"
exclude = []

[tool.ruff.lint]
extend-select = [
    "I",
    "UP",
    "B",
    "DTZ",
    "SIM",
    "PTH",
    "PLW",
    "PLE",
    "FLY",
    "FURB",
    "PGH",
    "N",
    "ANN",
    "RUF",
]
extend-ignore = [
    # self / cls do not need annotation
    "ANN101",
    "ANN102",
    "ANN401",  # disable any type ban
]
